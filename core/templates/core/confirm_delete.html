{% extends "core/base.html" %}

{% block title %}Delete {{ kind }} · LifeGrid{% endblock %}

{% block content %}
<div class="form-page">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="{{ cancel_url }}">Back</a></nav>

    <header class="form-head">
        <h1 class="display">Delete “{{ object.title }}”?</h1>
        <p class="sub">{{ warning }} This can't be undone.</p>
    </header>

    <form method="post" class="form-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete {{ kind }}</button>
        <a href="{{ cancel_url }}" class="btn btn-quiet">Keep it</a>
    </form>
</div>
{% endblock %}
