{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LifeGrid{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'core/favicon.svg' %}">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="brand">
                LifeGrid
            </div>

            {% if user.is_authenticated %}

            <nav class="nav">

                <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}nav-link--active{% endif %}"
                    href="{% url 'dashboard' %}">
                    Dashboard
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'calendar' %}nav-link--active{% endif %}"
                    href="{% url 'calendar' %}">
                    Calendar
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'create_goal' %}nav-link--active{% endif %}"
                    href="{% url 'create_goal' %}">
                    + New Goal
                </a>
            </nav>

            <div class="sidebar-bottom">

                <span>
                    {{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">
                        Logout
                    </button>
                </form>

            </div>

            {% else %}

            <nav class="nav auth-nav">
                <a class="nav-link {% if request.resolver_match.url_name == 'login' %}nav-link--active{% endif %}"
                    href="{% url 'login' %}">
                    Login
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'register' %}nav-link--active{% endif %}"
                    href="{% url 'register' %}">
                    Register
                </a>
            </nav>

            {% endif %}

        </aside>


        <main class="main">

            {% block content %}
            {% endblock %}

        </main>

    </div>
    {% load static %}
    <script src="{% static 'core/js/app.js' %}"></script>
</body>

</html>
