{% extends "core/base.html" %}

{% block title %}
Login - LifeGrid
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <h1>Welcome back</h1>
            <p>Log in to continue managing your goals.</p>
        </div>

        <form method="post" class="auth-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="button auth-button">
                Login
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Don't have an account?
                <a href="{% url 'register' %}">
                    Create one
                </a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
